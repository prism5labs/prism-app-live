<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#01313e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prism 5">
  <meta name="description" content="Prism 5 — one assistant that does it all, and becomes a second you.">
  <title>Prism 5</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patua+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-bg" class="app-bg" aria-hidden="true"><div class="app-bg-scrim"></div></div>
  <div id="opening-splash" class="opening-splash" aria-hidden="true">
    <video id="opening-splash-video" class="opening-splash-video" src="/opening-v5.mp4" poster="/opening-v5-poster.jpg" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="opening-splash-caption" id="opening-splash-caption">
      <span class="opening-splash-eyebrow">Prism 5</span>
      <span class="opening-splash-greeting" id="opening-splash-greeting">Welcome</span>
    </div>
  </div>
  <script>
    // If main.js never runs (a bad bundle, a stuck worker), the splash
    // would sit over the app forever — it is only ever removed by JS.
    // This backstop takes it down after 15s unless main.js has run.
    window.__prismSplashFallback = window.setTimeout(function () {
      if (!window.__prismMainLoaded) {
        var s = document.getElementById("opening-splash");
        if (s) s.remove();
      }
    }, 15000);
  </script>
  <div class="app-top">
    <header class="app-header">
      <img class="app-header-mark" src="/brand/gem.jpg" alt="" width="30" height="34">
      <span class="app-header-name" id="app-header-name">Prism 5</span>
      <span class="app-header-tag">Prism 5 Labs · Green Bay, WI</span>
    </header>
    <div class="chrome-thin" aria-hidden="true"></div>
  </div>
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status"></div>
  <div id="card-modal" class="card-modal" hidden></div>
  <script src="/main.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
