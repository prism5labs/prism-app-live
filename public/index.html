<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F5257">
  <meta name="description" content="Prism 5 — one assistant that does it all, and becomes a second you.">
  <title>Prism 5</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patua+One&family=Libre+Franklin:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-top">
    <header class="app-header">
      <span class="app-header-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 12 L92 88 L8 88 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path d="M28 62 L72 62" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="78" r="5" fill="currentColor"/></svg></span>
      <span class="app-header-name">Prism 5 Labs</span>
      <span class="app-header-tag">Est. 2026 · Green Bay, WI</span>
    </header>
    <div class="diner-strip" aria-hidden="true"></div>
  </div>
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="/main.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
